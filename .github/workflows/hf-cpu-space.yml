name: HF CPU Space

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spaces/hf_cpu/**"
      - "scripts/benchmark_hf_cpu.py"
      - "scripts/test_benchmark_hf_cpu.py"
      - "scripts/publish_hf_cpu_space.py"
      - "scripts/test_publish_hf_cpu_space.py"
      - "docs/HF_CPU_SPACE.md"
      - "docs/README.md"
      - ".github/workflows/hf-cpu-space.yml"
  push:
    branches: [main]
    paths:
      - "spaces/hf_cpu/**"
      - "scripts/benchmark_hf_cpu.py"
      - "scripts/test_benchmark_hf_cpu.py"
      - "scripts/publish_hf_cpu_space.py"
      - "scripts/test_publish_hf_cpu_space.py"
      - "docs/HF_CPU_SPACE.md"
      - "docs/README.md"
      - ".github/workflows/hf-cpu-space.yml"

concurrency:
  group: hf-cpu-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification tools
        run: python -m pip install "pytest==8.4.1" "requests==2.32.4" "huggingface_hub==0.34.4"
      - name: Verify source contracts
        run: >-
          python -m pytest spaces/hf_cpu/tests scripts/test_benchmark_hf_cpu.py
          scripts/test_publish_hf_cpu_space.py -q
          --basetemp=.pytest-tmp-hf-cpu-final -p no:cacheprovider
      - name: Compile Python source
        run: python -m compileall -q spaces/hf_cpu scripts
      - name: Reject whitespace errors
        run: git diff --check
      - name: Build CPU-only Space image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --tag ingexuity-hf-cpu:test spaces/hf_cpu 2>&1 | tee /tmp/hf-cpu-docker-build.log
      - name: Preserve failed Docker build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hf-cpu-docker-build-${{ github.sha }}
          path: /tmp/hf-cpu-docker-build.log
      - name: Smoke the warmed runtime and streamed API
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ingexuity-hf-cpu-test --publish 8000:8000 ingexuity-hf-cpu:test
          cleanup() { docker logs ingexuity-hf-cpu-test || true; docker rm --force ingexuity-hf-cpu-test || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' ingexuity-hf-cpu-test | grep -q true; then
              echo "Container exited before readiness"
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/api/runtime | grep -q '"state":"ready"'
          curl --fail --silent --no-buffer \
            --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Reply with two words."}],"max_new_tokens":16,"stream":true}' \
            http://127.0.0.1:8000/api/chat | tee /tmp/hf-cpu-smoke.sse
          grep -q 'event: meta' /tmp/hf-cpu-smoke.sse
          grep -q 'event: token' /tmp/hf-cpu-smoke.sse
          grep -q 'event: done' /tmp/hf-cpu-smoke.sse

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RELEASE_STAGE: credential
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install "requests==2.32.4" "huggingface_hub==0.34.4"
      - name: Require deployment credential
        shell: bash
        run: |
          test -n "${HF_TOKEN}" || (echo "Repository secret HF_TOKEN is required" && exit 1)
          echo "RELEASE_STAGE=publish" >> "${GITHUB_ENV}"
      - name: Publish reviewed Space source
        shell: bash
        run: |
          python scripts/publish_hf_cpu_space.py \
            --repo-id toxzak/ingexuity \
            --revision "${GITHUB_SHA}"
          echo "RELEASE_STAGE=benchmark" >> "${GITHUB_ENV}"
      - name: Benchmark deployed CPU Basic Space
        shell: bash
        run: |
          python scripts/benchmark_hf_cpu.py \
            --base-url https://toxzak-ingexuity.hf.space \
            --out artifacts/hf_cpu_benchmark.json
          echo "RELEASE_STAGE=benchmark-record" >> "${GITHUB_ENV}"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: hf-cpu-benchmark-${{ github.sha }}
          path: artifacts/hf_cpu_benchmark.json
      - name: Record benchmark artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add artifacts/hf_cpu_benchmark.json
          git commit -m "chore: record HF CPU benchmark [skip ci]"
          git push origin HEAD:main
          echo "RELEASE_STAGE=complete" >> "${GITHUB_ENV}"
      - name: Write release outcome
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          outcome = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "status": os.environ.get("RELEASE_JOB_STATUS"),
              "stage": os.environ.get("RELEASE_STAGE", "unknown"),
              "space": "toxzak/ingexuity",
          }
          Path("artifacts/hf_cpu_release_status.json").write_text(
              json.dumps(outcome, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(outcome, sort_keys=True))
          PY
      - name: Upload release outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-cpu-release-status-${{ github.sha }}
          path: artifacts/hf_cpu_release_status.json
      - name: Commit release outcome
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add artifacts/hf_cpu_release_status.json
          git commit -m "chore: record HF CPU release outcome [skip ci]" || exit 0
          git push origin HEAD:main
