name: Apply Rust lifetime fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fix snapshot guard lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ingexuity-server/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          old = '        Some(session.lock().await.clone())'
          new = '        let snapshot = session.lock().await.clone();\n        Some(snapshot)'
          if source.count(old) != 1:
              raise SystemExit(f'expected one snapshot expression, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ingexuity-server/src/lib.rs
          git commit -m "fix(server): drop snapshot guard before return"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
