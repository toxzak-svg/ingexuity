name: Materialize SQLite store

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Bind code to checked-in migration and typed corruption errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ingexuity-store/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          start = source.index('const MIGRATIONS:')
          end = source.index('\n\n#[derive(Debug, Error)]', start)
          source = (
              source[:start]
              + 'const MIGRATIONS: &[(u32, &str)] = &[(1, include_str!("../../../migrations/0001_event_store.sql"))];'
              + source[end:]
          )

          serialization_line = '    Serialization(#[from] serde_json::Error),\n'
          if serialization_line not in source:
              raise SystemExit('serialization line not found')
          source = source.replace(
              serialization_line,
              serialization_line
              + '    #[error("stored UUID is invalid: {0}")]\n'
              + '    InvalidUuid(#[from] uuid::Error),\n',
              1,
          )

          version_error_anchor = '    #[error("snapshot version must advance beyond {expected}, got {actual}")]\n'
          if version_error_anchor not in source:
              raise SystemExit('version error anchor not found')
          source = source.replace(
              version_error_anchor,
              '    #[error("stored snapshot version {snapshot_version} does not match row version {stored_version}")]\n'
              + '    SnapshotVersionMismatch {\n'
              + '        stored_version: u64,\n'
              + '        snapshot_version: u64,\n'
              + '    },\n'
              + version_error_anchor,
              1,
          )

          load_start = source.index('    pub fn load_session(')
          load_end = source.index('    pub fn append_events(', load_start)
          load = source[load_start:load_end]
          stored_anchor = '            Ok(StoredSession {\n'
          if stored_anchor not in load:
              raise SystemExit('stored session anchor not found')
          load = load.replace(
              stored_anchor,
              '            let stored_version = from_i64(version)?;\n'
              + '            if snapshot.version != stored_version {\n'
              + '                return Err(StoreError::SnapshotVersionMismatch {\n'
              + '                    stored_version,\n'
              + '                    snapshot_version: snapshot.version,\n'
              + '                });\n'
              + '            }\n'
              + stored_anchor,
              1,
          )
          version_line = '                version: from_i64(version)?,\n'
          if version_line not in load:
              raise SystemExit('stored version line not found')
          load = load.replace(version_line, '                version: stored_version,\n', 1)
          source = source[:load_start] + load + source[load_end:]

          list_start = source.index('    pub fn list_events(')
          list_end = source.index('    pub fn delete_session(', list_start)
          listing = source[list_start:list_end]
          uuid_start = listing.index('                event_id: Uuid::parse_str(&event_id)')
          uuid_end = listing.index('                event_type,', uuid_start)
          listing = (
              listing[:uuid_start]
              + '                event_id: Uuid::parse_str(&event_id)?,\n'
              + listing[uuid_end:]
          )
          source = source[:list_start] + listing + source[list_end:]

          path.write_text(source, encoding='utf-8')
          PY

      - name: Format and resolve dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/**/*.rs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: materialize SQLite store and lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
