name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Create diagnostics directory
        run: mkdir -p ci-artifacts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ci-artifacts/clippy.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features 2>&1 | tee ci-artifacts/test.log

      - name: Build release binary
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --workspace --release 2>&1 | tee ci-artifacts/build.log

      - name: Start model-free server
        id: smoke
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          target/release/ingexuity-server > ci-artifacts/server.log 2>&1 &
          echo $! > /tmp/ingexuity.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > ci-artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat ci-artifacts/server.log
          exit 1

      - name: Verify health contract
        id: health
        if: ${{ always() && steps.smoke.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          with open('ci-artifacts/health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          assert health['status'] == 'ok', health
          assert health['runtime'] == 'rust', health
          assert health['backend'] == 'ready', health
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/ingexuity.pid ]; then
            kill "$(cat /tmp/ingexuity.pid)" || true
          fi
          cat ci-artifacts/server.log || true

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-diagnostics
          if-no-files-found: warn
          path: ci-artifacts/**

      - name: Enforce Rust outcomes
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.health.outcome }}" = success

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build model-free image
        run: docker build --tag ingexuity:ci .

      - name: Smoke test container
        run: |
          docker run --detach --rm --name ingexuity-ci -p 8000:8000 ingexuity:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/container-health.json; then
              docker stop ingexuity-ci
              exit 0
            fi
            sleep 1
          done
          docker logs ingexuity-ci
          docker stop ingexuity-ci || true
          exit 1
