name: Diagnose durable runtime tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Run workspace tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features -- --nocapture 2>&1 | tee durable-runtime-tests.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-runtime-head-tests
          path: durable-runtime-tests.log

      - name: Fail when tests fail
        if: ${{ steps.test.outcome != 'success' }}
        run: exit 1
