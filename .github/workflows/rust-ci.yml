name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Start model-free server
        run: |
          target/release/ingexuity-server > /tmp/ingexuity.log 2>&1 &
          echo $! > /tmp/ingexuity.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ingexuity.log
          exit 1

      - name: Verify health contract
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          assert health['status'] == 'ok', health
          assert health['runtime'] == 'rust', health
          assert health['backend'] == 'ready', health
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/ingexuity.pid ]; then
            kill "$(cat /tmp/ingexuity.pid)" || true
          fi
          cat /tmp/ingexuity.log || true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build model-free image
        run: docker build --tag ingexuity:ci .

      - name: Smoke test container
        run: |
          docker run --detach --rm --name ingexuity-ci -p 8000:8000 ingexuity:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker stop ingexuity-ci
              exit 0
            fi
            sleep 1
          done
          docker logs ingexuity-ci
          docker stop ingexuity-ci || true
          exit 1
