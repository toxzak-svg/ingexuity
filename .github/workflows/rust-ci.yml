name: Diagnose persistent runtime

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Run Clippy
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-runtime-clippy
          path: clippy.log

      - name: Enforce lint result
        if: always()
        run: test "${{ steps.lint.outcome }}" = success
