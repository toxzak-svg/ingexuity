name: Diagnose SQLite store

on:
  pull_request:

permissions:
  contents: read

jobs:
  store-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Run store tests with focused failure output
        shell: bash
        run: |
          set +e
          cargo test --locked -p ingexuity-store -- --nocapture > /tmp/store-test.log 2>&1
          status=$?
          tail -n 160 /tmp/store-test.log
          exit $status
