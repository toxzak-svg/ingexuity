name: Apply version-overflow mapping

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Add explicit API mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ingexuity-server/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          anchor = '''            Self::Core(CoreError::MessageTooLarge) => {
                      (StatusCode::PAYLOAD_TOO_LARGE, "message_too_large")
                  }
          '''.replace('                  ', '')
          replacement = anchor + '''            Self::Core(CoreError::VersionOverflow) => {
                      (StatusCode::INTERNAL_SERVER_ERROR, "state_version_overflow")
                  }
          '''.replace('                  ', '')
          if source.count(anchor) != 1:
              raise SystemExit(f'error mapping anchor count: {source.count(anchor)}')
          path.write_text(source.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          cargo fmt --all

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ingexuity-server/src/lib.rs
          git commit -m "fix(server): map state version overflow explicitly"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
