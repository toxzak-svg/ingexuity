name: Materialize SQLite store

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Bind code to checked-in migration and typed corruption errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ingexuity-store/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          start = source.index('const MIGRATIONS:')
          end = source.index('\n\n#[derive(Debug, Error)]', start)
          source = (
              source[:start]
              + 'const MIGRATIONS: &[(u32, &str)] = &[(1, include_str!("../../../migrations/0001_event_store.sql"))];'
              + source[end:]
          )

          serialization = '''    #[error("state serialization failed: {0}")]
              Serialization(#[from] serde_json::Error),
          '''.replace('              ', '')
          typed = serialization + '''    #[error("stored UUID is invalid: {0}")]
              InvalidUuid(#[from] uuid::Error),
          '''.replace('              ', '')
          if source.count(serialization) != 1:
              raise SystemExit('serialization variant anchor not found exactly once')
          source = source.replace(serialization, typed, 1)

          mismatch = '''    #[error("snapshot session {snapshot_id} does not match requested session {requested_id}")]
              SnapshotSessionMismatch {
                  requested_id: SessionId,
                  snapshot_id: SessionId,
              },
          '''.replace('              ', '')
          mismatch_plus_version = mismatch + '''    #[error("stored snapshot version {snapshot_version} does not match row version {stored_version}")]
              SnapshotVersionMismatch {
                  stored_version: u64,
                  snapshot_version: u64,
              },
          '''.replace('              ', '')
          if source.count(mismatch) != 1:
              raise SystemExit('snapshot mismatch anchor not found exactly once')
          source = source.replace(mismatch, mismatch_plus_version, 1)

          old_version = '''            Ok(StoredSession {
                  session_id,
                  version: from_i64(version)?,
                  snapshot,
                  created_at_ms: from_i64(created_at_ms)?,
                  updated_at_ms: from_i64(updated_at_ms)?,
              })
          '''.replace('              ', '')
          new_version = '''            let stored_version = from_i64(version)?;
              if snapshot.version != stored_version {
                  return Err(StoreError::SnapshotVersionMismatch {
                      stored_version,
                      snapshot_version: snapshot.version,
                  });
              }
              Ok(StoredSession {
                  session_id,
                  version: stored_version,
                  snapshot,
                  created_at_ms: from_i64(created_at_ms)?,
                  updated_at_ms: from_i64(updated_at_ms)?,
              })
          '''.replace('              ', '')
          if source.count(old_version) != 1:
              raise SystemExit('stored session construction anchor not found exactly once')
          source = source.replace(old_version, new_version, 1)

          uuid_start = source.index('                event_id: Uuid::parse_str(&event_id)')
          uuid_end = source.index('                event_type,', uuid_start)
          source = (
              source[:uuid_start]
              + '                event_id: Uuid::parse_str(&event_id)?,\n'
              + source[uuid_end:]
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Format and resolve dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/**/*.rs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: materialize SQLite store and lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
