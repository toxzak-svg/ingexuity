name: Materialize persistent runtime

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Add reset and session-list transitions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('crates/ingexuity-core/src/lib.rs')
          core = core_path.read_text(encoding='utf-8')
          reset_anchor = '    fn record_user_message(&mut self, message: &str) {'
          reset_code = '''    pub fn reset(&mut self) -> Result<(), CoreError> {
              let next_version = self
                  .version
                  .checked_add(1)
                  .ok_or(CoreError::VersionOverflow)?;
              *self = Self::new(self.session_id);
              self.version = next_version;
              Ok(())
          }

              fn record_user_message(&mut self, message: &str) {
          '''.replace('              ', '')
          if core.count(reset_anchor) != 1:
              raise SystemExit(f'reset anchor count: {core.count(reset_anchor)}')
          core = core.replace(reset_anchor, reset_code.rstrip('\n'), 1)

          error_anchor = '    #[error("message exceeds {MAX_MESSAGE_BYTES} bytes")]\n    MessageTooLarge,\n'
          error_code = error_anchor + '    #[error("conversation state version overflowed")]\n    VersionOverflow,\n'
          if core.count(error_anchor) != 1:
              raise SystemExit('core error anchor not found')
          core = core.replace(error_anchor, error_code, 1)

          test_anchor = '    #[test]\n    fn deterministic_backend_is_repeatable() {'
          test_code = '''    #[test]
              fn reset_clears_personal_state_and_advances_version() {
                  let mut state = ConversationState::new(Uuid::new_v4());
                  process_turn(&mut state, "Rust work", &HeuristicBackend).unwrap();
                  let prior_version = state.version;

                  state.reset().unwrap();

                  assert_eq!(state.turn_count, 0);
                  assert!(state.turns.is_empty());
                  assert!(state.predictions.is_empty());
                  assert!(state.user_model.topics.is_empty());
                  assert_eq!(state.version, prior_version + 1);
              }

              #[test]
              fn deterministic_backend_is_repeatable() {
          '''.replace('              ', '')
          if core.count(test_anchor) != 1:
              raise SystemExit('core test anchor not found')
          core = core.replace(test_anchor, test_code.rstrip('\n'), 1)
          core_path.write_text(core, encoding='utf-8')

          store_path = Path('crates/ingexuity-store/src/lib.rs')
          store = store_path.read_text(encoding='utf-8')
          list_anchor = '    pub fn delete_session(&self, session_id: SessionId) -> Result<bool, StoreError> {'
          list_code = '''    pub fn list_sessions(&self) -> Result<Vec<StoredSession>, StoreError> {
              let connection = self.connection()?;
              let mut statement = connection.prepare(
                  "SELECT session_id, version, snapshot_json, created_at_ms, updated_at_ms
                   FROM sessions ORDER BY created_at_ms ASC, session_id ASC",
              )?;
              let rows = statement.query_map([], |row| {
                  Ok((
                      row.get::<_, String>(0)?,
                      row.get::<_, i64>(1)?,
                      row.get::<_, String>(2)?,
                      row.get::<_, i64>(3)?,
                      row.get::<_, i64>(4)?,
                  ))
              })?;

              let mut sessions = Vec::new();
              for row in rows {
                  let (session_id, version, snapshot_json, created_at_ms, updated_at_ms) = row?;
                  let session_id = Uuid::parse_str(&session_id)?;
                  let stored_version = from_i64(version)?;
                  let snapshot: ConversationState = serde_json::from_str(&snapshot_json)?;
                  if snapshot.session_id != session_id {
                      return Err(StoreError::SnapshotSessionMismatch {
                          requested_id: session_id,
                          snapshot_id: snapshot.session_id,
                      });
                  }
                  if snapshot.version != stored_version {
                      return Err(StoreError::SnapshotVersionMismatch {
                          stored_version,
                          snapshot_version: snapshot.version,
                      });
                  }
                  sessions.push(StoredSession {
                      session_id,
                      version: stored_version,
                      snapshot,
                      created_at_ms: from_i64(created_at_ms)?,
                      updated_at_ms: from_i64(updated_at_ms)?,
                  });
              }
              Ok(sessions)
          }

              pub fn delete_session(&self, session_id: SessionId) -> Result<bool, StoreError> {
          '''.replace('              ', '')
          if store.count(list_anchor) != 1:
              raise SystemExit(f'list anchor count: {store.count(list_anchor)}')
          store = store.replace(list_anchor, list_code.rstrip('\n'), 1)

          test_anchor = '    #[test]\n    fn snapshot_identity_and_version_must_be_valid() {'
          test_code = '''    #[test]
              fn list_sessions_returns_valid_snapshots_in_stable_order() {
                  let store = SqliteStore::open_in_memory().unwrap();
                  let first = ConversationState::new(Uuid::new_v4());
                  let second = ConversationState::new(Uuid::new_v4());
                  store.create_session(&first, 100).unwrap();
                  store.create_session(&second, 200).unwrap();

                  let sessions = store.list_sessions().unwrap();
                  assert_eq!(sessions.len(), 2);
                  assert_eq!(sessions[0].session_id, first.session_id);
                  assert_eq!(sessions[1].session_id, second.session_id);
              }

              #[test]
              fn snapshot_identity_and_version_must_be_valid() {
          '''.replace('              ', '')
          if store.count(test_anchor) != 1:
              raise SystemExit('store test anchor not found')
          store = store.replace(test_anchor, test_code.rstrip('\n'), 1)
          store_path.write_text(store, encoding='utf-8')

          server_path = Path('crates/ingexuity-server/src/lib.rs')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace('guard.reset();', 'guard.reset()?;', 1)
          server = server.replace('"backend_id": backend.id,', '"backend_id": backend.id.clone(),', 1)
          server = server.replace('            state.sessions.restore(stored).await;', '            let _restored = state.sessions.restore(stored).await;', 1)
          server_path.write_text(server, encoding='utf-8')
          PY

      - name: Format and resolve dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/**/*.rs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: materialize persistent runtime transitions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
