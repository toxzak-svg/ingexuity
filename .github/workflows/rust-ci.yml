name: Stress durable runtime tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Compile test binaries
        run: cargo test --locked --workspace --all-features --no-run

      - name: Repeat exact workspace test command
        id: stress
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > durable-runtime-tests.log
          status=0
          for run in $(seq 1 10); do
            echo "===== WORKSPACE TEST RUN ${run} =====" | tee -a durable-runtime-tests.log
            cargo test --locked --workspace --all-features >> durable-runtime-tests.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "FAILED_RUN=${run}" | tee -a durable-runtime-tests.log
              break
            fi
          done
          echo "$status" > durable-runtime-test-status
          tail -n 220 durable-runtime-tests.log
          exit "$status"

      - name: Upload stress output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-runtime-stress-tests
          path: |
            durable-runtime-tests.log
            durable-runtime-test-status

      - name: Enforce recorded result
        if: always()
        run: test "$(cat durable-runtime-test-status)" = 0
