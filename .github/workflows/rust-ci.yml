name: Materialize Phase 1 Rust outputs

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Report configured session TTL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ingexuity-server/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          anchor = '''    pub async fn count(&self) -> usize {
              self.sweep_expired().await;
              self.sessions.read().await.len()
          }
          '''.replace('          ', '')
          replacement = '''    #[must_use]
          pub fn ttl_seconds(&self) -> u64 {
              self.ttl_ms.div_ceil(1000)
          }

          pub async fn count(&self) -> usize {
              self.sweep_expired().await;
              self.sessions.read().await.len()
          }
          '''.replace('          ', '')
          if source.count(anchor) != 1:
              raise SystemExit(f'count anchor occurrences: {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          old = '            expires_in_seconds: DEFAULT_SESSION_TTL.as_secs(),'
          new = '            expires_in_seconds: state.sessions.ttl_seconds(),'
          if source.count(old) != 1:
              raise SystemExit(f'expiry response occurrences: {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Format and resolve dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/**/*.rs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: materialize Phase 1 lockfile and formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
