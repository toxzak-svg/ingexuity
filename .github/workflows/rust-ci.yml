name: Correct SQLite conflict fixture

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct expected version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ingexuity-store/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          old = '.append_events(session_id, 9, &[event], &next, 111)'
          new = '.append_events(session_id, 1, &[event], &next, 111)'
          if source.count(old) != 1:
              raise SystemExit(f'expected one conflict fixture, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ingexuity-store/src/lib.rs
          git commit -m "test(store): exercise true optimistic version conflict"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
