name: Diagnose workspace tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Test core
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p ingexuity-core -- --nocapture 2>&1 | tee core-test.log

      - name: Test store
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p ingexuity-store -- --nocapture 2>&1 | tee store-test.log

      - name: Test server
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p ingexuity-server -- --nocapture 2>&1 | tee server-test.log

      - name: Upload package test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-package-test-logs
          path: '*-test.log'
