# Restored after the durable-runtime integration stress pass.
name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Build release binary
        run: cargo build --locked --workspace --release

      - name: Start durable model-free server
        env:
          INGEXUITY_DB_PATH: /tmp/ingexuity-ci.sqlite3
        run: |
          target/release/ingexuity-server > /tmp/ingexuity.log 2>&1 &
          echo $! > /tmp/ingexuity.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /tmp/live.json \
              && curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/ready.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ingexuity.log
          exit 1

      - name: Verify health and create durable session
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with open('/tmp/live.json', encoding='utf-8') as handle:
              live = json.load(handle)
          with open('/tmp/ready.json', encoding='utf-8') as handle:
              ready = json.load(handle)
          assert live['status'] == 'ok', live
          assert live['runtime'] == 'rust', live
          assert ready['status'] == 'ready', ready
          assert ready['runtime'] == 'rust', ready
          assert ready['backend'] == 'ready', ready
          assert ready['storage'] == 'ready', ready
          assert ready['available_inference_slots'] >= 1, ready

          request = urllib.request.Request(
              'http://127.0.0.1:8000/api/v1/sessions',
              data=b'',
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              created = json.load(response)
          with open('/tmp/session-id', 'w', encoding='utf-8') as handle:
              handle.write(created['session_id'])
          PY

      - name: Restart and verify recovery
        env:
          INGEXUITY_DB_PATH: /tmp/ingexuity-ci.sqlite3
        run: |
          kill "$(cat /tmp/ingexuity.pid)"
          wait "$(cat /tmp/ingexuity.pid)" || true
          target/release/ingexuity-server > /tmp/ingexuity-restart.log 2>&1 &
          echo $! > /tmp/ingexuity.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:8000/api/v1/sessions/$(cat /tmp/session-id)" > /tmp/recovered.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ingexuity-restart.log
          exit 1

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/ingexuity.pid ]; then
            kill "$(cat /tmp/ingexuity.pid)" || true
          fi
          cat /tmp/ingexuity.log || true
          cat /tmp/ingexuity-restart.log || true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build model-free image
        run: docker build --tag ingexuity:ci .

      - name: Smoke test durable container restart
        run: |
          docker volume create ingexuity-ci-data
          docker run --detach --rm --name ingexuity-ci \
            -p 8000:8000 \
            -v ingexuity-ci-data:/app/data \
            ingexuity:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/container-ready.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/sessions > /tmp/container-session.json
          python3 - <<'PY'
          import json
          with open('/tmp/container-session.json', encoding='utf-8') as handle:
              session = json.load(handle)
          with open('/tmp/container-session-id', 'w', encoding='utf-8') as handle:
              handle.write(session['session_id'])
          PY
          docker stop ingexuity-ci

          docker run --detach --rm --name ingexuity-ci \
            -p 8000:8000 \
            -v ingexuity-ci-data:/app/data \
            ingexuity:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:8000/api/v1/sessions/$(cat /tmp/container-session-id)" > /tmp/container-recovered.json; then
              docker stop ingexuity-ci
              docker volume rm ingexuity-ci-data
              exit 0
            fi
            sleep 1
          done
          docker logs ingexuity-ci
          docker stop ingexuity-ci || true
          docker volume rm ingexuity-ci-data || true
          exit 1
