name: Diagnose persistent runtime build

on:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Run Clippy
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee native-build.log

      - name: Upload native compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-runtime-native-build
          path: native-build.log

      - name: Enforce native result
        if: always()
        run: test "${{ steps.lint.outcome }}" = success

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --tag ingexuity:ci . 2>&1 | tee docker-build.log

      - name: Upload Docker compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-runtime-docker-build
          path: docker-build.log

      - name: Enforce Docker result
        if: always()
        run: test "${{ steps.build.outcome }}" = success
