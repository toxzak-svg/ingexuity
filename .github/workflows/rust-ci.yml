name: Diagnose SQLite store

on:
  pull_request:

permissions:
  contents: read

jobs:
  store-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Run store tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p ingexuity-store -- --nocapture 2>&1 | tee store-test.log

      - name: Upload store test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-store-test-log
          path: store-test.log

      - name: Enforce test result
        if: always()
        run: test "${{ steps.test.outcome }}" = success
