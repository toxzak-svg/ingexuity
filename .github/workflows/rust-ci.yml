name: Diagnose durable runtime tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Run workspace tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features -- --nocapture 2>&1 | tee durable-runtime-tests.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-runtime-tests
          path: durable-runtime-tests.log

      - name: Enforce test result
        if: always()
        run: test "${{ steps.test.outcome }}" = success
